name: rstatix_shapiro_test
tool: rstatix 0.7.2 shapiro_test
summary: Shapiro-Wilk normality test of numeric columns, optionally per group.
usage: |
  Use to check normality of one or more columns (comma-separated), overall or within each level of group_col.
inputs:
  data: table
outputs:
  result: rstatix_shapiro_table
params:
  variables:
    default: ''
    help: Comma-separated numeric columns.
  group_col:
    default: ''
    help: Optional grouping column.
interpreter: Rscript
script: |
  suppressPackageStartupMessages({
    library(rstatix)
    library(dplyr)
  })
  data <- read.csv(Sys.getenv("IN_data"), check.names = FALSE, stringsAsFactors = FALSE)
  vars <- trimws(strsplit(Sys.getenv("PARAM_variables"), ",")[[1]])
  if (nzchar(Sys.getenv("PARAM_group_col"))) data <- group_by(data, .data[[Sys.getenv("PARAM_group_col")]])
  res <- shapiro_test(data, vars = vars)
  res <- as.data.frame(res)
  res <- res[, !sapply(res, is.list), drop = FALSE]
  write.csv(res, Sys.getenv("OUT_result"), row.names = FALSE)
