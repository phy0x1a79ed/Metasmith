name: correlation_test
tool: scipy.stats 1.14.1 pearsonr / spearmanr / kendalltau
summary: Correlation coefficient and p-value between two numeric columns.
usage: |
  Use to test association of two numeric columns. Pearson measures linear association; Spearman and Kendall are rank-based. Rows missing either value are dropped.
inputs:
  data: table
outputs:
  result: correlation_test_result
params:
  col_1:
    default: ''
    help: First numeric column.
  col_2:
    default: ''
    help: Second numeric column.
  method:
    default: pearson
    help: pearson, spearman or kendall.
  alternative:
    default: two-sided
    help: 'Alternative hypothesis: two-sided, less or greater (first group relative to second).'
interpreter: python
script: |
  import os
  import numpy as np
  import pandas as pd
  from scipy import stats

  e = os.environ
  data = pd.read_csv(e["IN_data"])
  d = data[[e["PARAM_col_1"], e["PARAM_col_2"]]].dropna()
  f = {"pearson": stats.pearsonr, "spearman": stats.spearmanr, "kendall": stats.kendalltau}[e["PARAM_method"]]
  res = f(d.iloc[:, 0], d.iloc[:, 1], alternative=e["PARAM_alternative"])
  row = dict(method=e["PARAM_method"], coefficient=res[0], pvalue=res[1], n=len(d))
  pd.DataFrame([row]).to_csv(e["OUT_result"], index=False)
