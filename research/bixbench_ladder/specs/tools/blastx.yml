name: blastx
tool: BLAST+ 2.16.0 blastx
summary: Translate nucleotide queries in six frames and search them against a protein BLAST database.
usage: |
  Use to find which proteins a nucleotide sequence resembles, for example to find coding regions in reads or contigs. The genetic code, matrix and gap costs change the scores.
inputs:
  query: sequences_fasta
  db: blast_database
outputs:
  hits: blastx_hits_table
params:
  evalue:
    default: '10'
    help: 'expect-value threshold: hits with a larger e-value are dropped'
  max_target_seqs:
    default: '500'
    help: maximum number of aligned database sequences kept per query
  matrix:
    default: BLOSUM62
    help: amino-acid scoring matrix, for example BLOSUM62, BLOSUM45, BLOSUM80, PAM30, PAM70
  query_gencode:
    default: '1'
    help: NCBI genetic code table used to translate the query
  strand:
    default: both
    help: 'query strand to translate: both, plus or minus'
  gapopen:
    default: '11'
    help: gap opening cost
  gapextend:
    default: '1'
    help: gap extension cost
  seg:
    default: 'no'
    help: yes filters low-complexity query regions with SEG
  columns:
    default: qseqid sseqid pident length mismatch gapopen qstart qend sstart send evalue bitscore
    help: space-separated BLAST tabular output fields (the tool's default twelve); other fields such as qlen slen qcovs staxids stitle can be added
interpreter: bash
script: |
  args=()
  add() { if [ -n "$2" ]; then args+=("$1" "$2"); fi; }

  add -query_gencode "$PARAM_query_gencode"; add -strand "$PARAM_strand"; add -matrix "$PARAM_matrix"; add -gapopen "$PARAM_gapopen"; add -gapextend "$PARAM_gapextend"; add -seg "$PARAM_seg"
  cols="$PARAM_columns"
  { echo "$cols" | tr ' ' ','; blastx -query "$IN_query" -db "$IN_db/db" -evalue "$PARAM_evalue" -max_target_seqs "$PARAM_max_target_seqs" "${args[@]}" -outfmt "10 $cols"; } > "$OUT_hits"
