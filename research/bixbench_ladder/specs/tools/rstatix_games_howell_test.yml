name: rstatix_games_howell_test
tool: rstatix 0.7.2 games_howell_test
summary: Games-Howell all-pairs comparison for unequal variances.
usage: |
  Use as the post-hoc test after Welch ANOVA when group variances or sizes differ.
inputs:
  data: table
outputs:
  result: rstatix_games_howell_table
params:
  formula:
    default: ''
    help: Formula 'value ~ group' with the numeric column on the left and the grouping column on the right.
  conf_level:
    default: '0.95'
    help: Confidence level.
interpreter: Rscript
script: |
  suppressPackageStartupMessages({
    library(rstatix)
    library(dplyr)
  })
  data <- read.csv(Sys.getenv("IN_data"), check.names = FALSE, stringsAsFactors = FALSE)
  res <- games_howell_test(data, as.formula(Sys.getenv("PARAM_formula")), conf.level = as.numeric(Sys.getenv("PARAM_conf_level")))
  res <- as.data.frame(res)
  res <- res[, !sapply(res, is.list), drop = FALSE]
  write.csv(res, Sys.getenv("OUT_result"), row.names = FALSE)
