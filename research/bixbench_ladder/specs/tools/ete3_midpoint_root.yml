name: ete3_midpoint_root
tool: ete3 3.1.3 Tree
summary: Root a tree at its midpoint.
usage: |
  Use when no outgroup is known: the root is placed halfway along the longest leaf-to-leaf path, which assumes similar rates in the two halves. Requires branch lengths.
inputs:
  tree: source_tree
outputs:
  out: ete3_midpoint_rooted_tree
interpreter: python
script: |
  import os
  from ete3 import Tree
  t = Tree(open(os.environ["IN_tree"]).read(), format=0)
  t.set_outgroup(t.get_midpoint_outgroup())
  open(os.environ["OUT_out"], "w").write(t.write(format=0) + "\n")
