name: tblastx
tool: BLAST+ 2.16.0 tblastx
summary: Search a six-frame translation of nucleotide queries against the six-frame translation of a nucleotide database.
usage: |
  Use for distant nucleotide sequences whose similarity shows only at the protein level. It is slow and its e-values are not comparable with blastn. No gapped alignments are produced.
inputs:
  query: sequences_fasta
  db: blast_database
outputs:
  hits: tblastx_hits_table
params:
  evalue:
    default: '10'
    help: 'expect-value threshold: hits with a larger e-value are dropped'
  max_target_seqs:
    default: '500'
    help: maximum number of aligned database sequences kept per query
  matrix:
    default: BLOSUM62
    help: amino-acid scoring matrix, for example BLOSUM62, BLOSUM45, BLOSUM80, PAM30, PAM70
  query_gencode:
    default: '1'
    help: NCBI genetic code table used to translate the query
  db_gencode:
    default: '1'
    help: NCBI genetic code table used to translate the database
  strand:
    default: both
    help: 'query strand to translate: both, plus or minus'
  columns:
    default: qseqid sseqid pident length mismatch gapopen qstart qend sstart send evalue bitscore
    help: space-separated BLAST tabular output fields (the tool's default twelve); other fields such as qlen slen qcovs staxids stitle can be added
interpreter: bash
script: |
  args=()
  add() { if [ -n "$2" ]; then args+=("$1" "$2"); fi; }

  add -query_gencode "$PARAM_query_gencode"; add -db_gencode "$PARAM_db_gencode"; add -strand "$PARAM_strand"; add -matrix "$PARAM_matrix"
  cols="$PARAM_columns"
  { echo "$cols" | tr ' ' ','; tblastx -query "$IN_query" -db "$IN_db/db" -evalue "$PARAM_evalue" -max_target_seqs "$PARAM_max_target_seqs" "${args[@]}" -outfmt "10 $cols"; } > "$OUT_hits"
