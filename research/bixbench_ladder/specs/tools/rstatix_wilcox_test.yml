name: rstatix_wilcox_test
tool: rstatix 0.7.2 wilcox_test
summary: Wilcoxon rank-sum or signed-rank tests from a formula, with adjusted p-values.
usage: |
  Use for non-parametric comparisons between groups; paired TRUE gives the signed-rank test. With more than two groups all pairs are tested and adjusted.
inputs:
  data: table
outputs:
  result: rstatix_wilcox_test_table
params:
  formula:
    default: ''
    help: Formula 'value ~ group' with the numeric column on the left and the grouping column on the right.
  paired:
    default: 'FALSE'
    help: TRUE for the signed-rank test.
  alternative:
    default: two.sided
    help: 'Alternative: two.sided, less or greater.'
  mu:
    default: '0'
    help: Null location shift.
  p_adjust_method:
    default: holm
    help: 'p.adjust method: holm, hochberg, hommel, bonferroni, BH, BY, fdr or none.'
  conf_level:
    default: '0.95'
    help: Confidence level.
interpreter: Rscript
script: |
  suppressPackageStartupMessages({
    library(rstatix)
    library(dplyr)
  })
  data <- read.csv(Sys.getenv("IN_data"), check.names = FALSE, stringsAsFactors = FALSE)
  res <- wilcox_test(data, as.formula(Sys.getenv("PARAM_formula")), paired = Sys.getenv("PARAM_paired") == "TRUE",
                      alternative = Sys.getenv("PARAM_alternative"), mu = as.numeric(Sys.getenv("PARAM_mu")),
                      p.adjust.method = Sys.getenv("PARAM_p_adjust_method"), conf.level = as.numeric(Sys.getenv("PARAM_conf_level")), detailed = TRUE)
  res <- as.data.frame(res)
  res <- res[, !sapply(res, is.list), drop = FALSE]
  write.csv(res, Sys.getenv("OUT_result"), row.names = FALSE)
