name: ete3_robinson_foulds
tool: ete3 3.1.3 Tree.robinson_foulds
summary: Compute the Robinson-Foulds distance between two trees with ete3.
usage: |
  The RF distance counts bipartitions present in one tree but not the other; max_rf is the largest possible value for the shared leaves and normalized_rf is rf divided by max_rf (0 identical, 1 maximally different). unrooted_trees yes compares the trees as unrooted, which is the usual choice; with no, root placement also counts. Trees are restricted to their shared leaves. min_support values discard weakly supported branches before comparing; expand_polytomies resolves polytomies in every possible way and reports the best matching.
inputs:
  tree: tree
  tree_b: second_tree
outputs:
  table: ete3_robinson_foulds_table
params:
  unrooted_trees:
    default: 'no'
    help: yes compares the trees as unrooted
  expand_polytomies:
    default: 'no'
    help: yes expands polytomies in all possible ways and keeps the minimum distance
  min_support_t1:
    default: '0'
    help: branches of the first tree with support below this value are ignored
  min_support_t2:
    default: '0'
    help: branches of the second tree with support below this value are ignored
interpreter: python
script: |
  import os
  import pandas as pd
  from ete3 import Tree

  t1 = Tree(open(os.environ["IN_tree"]).read(), format=0)
  t2 = Tree(open(os.environ["IN_tree_b"]).read(), format=0)
  rf, mx, common, e1, e2, d1, d2 = t1.robinson_foulds(t2, unrooted_trees=os.environ["PARAM_unrooted_trees"] == "yes",
                                                      expand_polytomies=os.environ["PARAM_expand_polytomies"] == "yes",
                                                      min_support_t1=float(os.environ["PARAM_min_support_t1"]),
                                                      min_support_t2=float(os.environ["PARAM_min_support_t2"]))
  pd.DataFrame([dict(rf=rf, max_rf=mx, normalized_rf=rf / mx if mx else None, n_common_leaves=len(common))]).to_csv(os.environ["OUT_table"], index=False)
