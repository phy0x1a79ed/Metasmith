name: ols_regression
tool: statsmodels 0.14.4 ols
summary: Ordinary least squares regression from a formula, with a coefficient table.
usage: |
  Use for a linear model of a numeric response on numeric and categorical predictors. Categorical terms use C(col) with treatment coding (first level in sorted order as reference). cov_type HC3 etc. give robust standard errors.
inputs:
  data: table
outputs:
  result: ols_coefficients
params:
  formula:
    default: ''
    help: Patsy model formula, for example 'value ~ x1 + C(group)'.
  cov_type:
    default: nonrobust
    help: 'Covariance estimator: nonrobust, HC0, HC1, HC2 or HC3.'
  alpha:
    default: '0.05'
    help: Significance level; confidence intervals are 1 - alpha.
interpreter: python
script: |
  import os
  import numpy as np
  import pandas as pd
  import statsmodels.api as sm
  import statsmodels.formula.api as smf

  e = os.environ
  data = pd.read_csv(e["IN_data"])
  res = smf.ols(e["PARAM_formula"], data).fit(cov_type=e["PARAM_cov_type"])
  ci = res.conf_int(alpha=float(e["PARAM_alpha"]))
  out = pd.DataFrame({"term": res.params.index, "estimate": res.params.values, "std_err": res.bse.values,
      "statistic": res.tvalues.values, "pvalue": res.pvalues.values, "ci_low": ci[0].values, "ci_high": ci[1].values})
  out.to_csv(e["OUT_result"], index=False)
