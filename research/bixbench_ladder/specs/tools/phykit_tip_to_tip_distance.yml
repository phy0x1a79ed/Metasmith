name: phykit_tip_to_tip_distance
tool: PhyKIT 2.0.1 tip_to_tip_distance
summary: Report the patristic distance between two named tips of a tree.
usage: |
  The sum of branch lengths on the path between the two tips.
inputs:
  tree: tree
outputs:
  out: tip_to_tip_distance_table
params:
  tip_1:
    default: ''
    help: name of the first tip (required)
  tip_2:
    default: ''
    help: name of the second tip (required)
interpreter: bash
script: |
  { echo "tip_1,tip_2,distance"; phykit tip_to_tip_distance "$IN_tree" "$PARAM_tip_1" "$PARAM_tip_2" | paste -d, <(echo "$PARAM_tip_1,$PARAM_tip_2") -; } > "$OUT_out"
