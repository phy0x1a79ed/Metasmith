name: random_forest_regressor_cv
tool: scikit-learn 1.6.0 RandomForestRegressor
summary: Cross-validated score of a random forest regressor.
usage: |
  Use to predict a numeric response from numeric features. Default scoring is R-squared; use neg_mean_squared_error for error.
inputs:
  data: table
outputs:
  result: random_forest_regressor_cv_scores
params:
  features:
    default: ''
    help: Comma-separated names of the numeric feature columns.
  target_col:
    default: ''
    help: Name of the numeric response column.
  cv:
    default: '5'
    help: Number of cross-validation folds (stratified for classifiers, unshuffled).
  scoring:
    default: ''
    help: scikit-learn scoring name, for example r2, neg_mean_squared_error, neg_mean_absolute_error; empty uses the estimator's default (R-squared).
  n_estimators:
    default: '100'
    help: Number of trees.
  random_state:
    default: None
    help: Integer random seed, or None for an unseeded run.
interpreter: python
script: |
  import os
  import numpy as np
  import pandas as pd

  e = os.environ
  data = pd.read_csv(e["IN_data"])
  from sklearn.model_selection import cross_val_score
  rs = None if e["PARAM_random_state"] == "None" else int(e["PARAM_random_state"])
  cols = [c.strip() for c in e["PARAM_features"].split(",")]
  X = data[cols]
  y = data[e["PARAM_target_col"]]
  from sklearn.ensemble import RandomForestRegressor
  model = RandomForestRegressor(n_estimators=int(e["PARAM_n_estimators"]), random_state=rs)
  scores = cross_val_score(model, X, y, cv=int(e["PARAM_cv"]), scoring=e["PARAM_scoring"] or None)
  out = pd.DataFrame({"fold": range(1, len(scores) + 1), "score": scores})
  out.to_csv(e["OUT_result"], index=False)
