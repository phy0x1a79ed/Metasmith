name: rstatix_cohens_d
tool: rstatix 0.7.2 cohens_d
summary: Cohen's d effect size between two groups.
usage: |
  Use to quantify the standardised mean difference. hedges_correction TRUE gives Hedges' g. var_equal FALSE (default) uses the average of the group variances.
inputs:
  data: table
outputs:
  result: rstatix_cohens_d_table
params:
  formula:
    default: ''
    help: Formula 'value ~ group' with the numeric column on the left and the grouping column on the right.
  paired:
    default: 'FALSE'
    help: TRUE for paired data.
  var_equal:
    default: 'FALSE'
    help: TRUE for pooled standard deviation.
  hedges_correction:
    default: 'FALSE'
    help: TRUE for small-sample correction.
interpreter: Rscript
script: |
  suppressPackageStartupMessages({
    library(rstatix)
    library(dplyr)
  })
  data <- read.csv(Sys.getenv("IN_data"), check.names = FALSE, stringsAsFactors = FALSE)
  res <- cohens_d(data, as.formula(Sys.getenv("PARAM_formula")), paired = Sys.getenv("PARAM_paired") == "TRUE",
                   var.equal = Sys.getenv("PARAM_var_equal") == "TRUE", hedges.correction = Sys.getenv("PARAM_hedges_correction") == "TRUE")
  res <- as.data.frame(res)
  res <- res[, !sapply(res, is.list), drop = FALSE]
  write.csv(res, Sys.getenv("OUT_result"), row.names = FALSE)
