name: clusterprofiler_enrichgo_universe
tool: clusterProfiler 4.10.0 (R) with org.Hs.eg.db 3.18.0
summary: GO over-representation analysis of a human gene list with enrichGO (hypergeometric test), against an explicit background universe.
usage: |
  Use for a list of selected genes (for example differentially expressed genes) and the Gene Ontology. The background is the explicit universe gene list, also in key_type; input genes outside it are ignored. A background that matches the genes that could have been detected in the experiment is the statistically correct choice. Offline, using the installed GO.db and org.Hs.eg.db only.
  Choices that change the numbers: identifier type, ontology (the tool default is MF), the multiple testing method, size limits for the tested terms, and the p and q cutoffs, which only filter the output. Terms need at least one input gene. The rds output keeps the full result object for simplify.
inputs:
  genes: gene_list
  universe: background_gene_list
outputs:
  table: enrichgo_universe_table
  object: enrichgo_universe_object
params:
  key_type:
    default: "ENTREZID"
    help: Identifier type of the input genes in org.Hs.eg.db, for example ENTREZID, SYMBOL or ENSEMBL.
  ontology:
    default: "MF"
    help: GO ontology, BP, MF, CC or ALL.
  p_adjust_method:
    default: "BH"
    help: Multiple testing method, one of holm, hochberg, hommel, bonferroni, BH, BY, fdr or none.
  pvalue_cutoff:
    default: "0.05"
    help: Terms with an adjusted p-value above this are dropped from the output; use 1 to keep every tested term.
  qvalue_cutoff:
    default: "0.2"
    help: Terms with a q-value above this are dropped; use 1 to keep every tested term.
  min_gs_size:
    default: "10"
    help: Smallest gene set size tested, counted among the background genes.
  max_gs_size:
    default: "500"
    help: Largest gene set size tested.
  read_able:
    default: "FALSE"
    help: TRUE or FALSE, translate ENTREZID gene ids in the geneID column to symbols (only valid with key_type ENTREZID).
interpreter: Rscript
script: |
  suppressMessages({library(clusterProfiler); library(org.Hs.eg.db)})
  genes <- unique(trimws(readLines(Sys.getenv("IN_genes")))); genes <- genes[nzchar(genes)]
  universe <- unique(trimws(readLines(Sys.getenv("IN_universe")))); universe <- universe[nzchar(universe)]
  res <- enrichGO(gene = genes, OrgDb = org.Hs.eg.db, keyType = Sys.getenv("PARAM_key_type"),
                 ont = Sys.getenv("PARAM_ontology"), pvalueCutoff = as.numeric(Sys.getenv("PARAM_pvalue_cutoff")),
                 pAdjustMethod = Sys.getenv("PARAM_p_adjust_method"), qvalueCutoff = as.numeric(Sys.getenv("PARAM_qvalue_cutoff")),
                 minGSSize = as.integer(Sys.getenv("PARAM_min_gs_size")), maxGSSize = as.integer(Sys.getenv("PARAM_max_gs_size")),
                 readable = as.logical(Sys.getenv("PARAM_read_able")), universe = universe)
  df <- if (is.null(res)) data.frame() else as.data.frame(res)
  write.csv(df, Sys.getenv("OUT_table"), row.names = FALSE)
  saveRDS(res, Sys.getenv("OUT_object"))
