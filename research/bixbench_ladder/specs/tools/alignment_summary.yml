name: alignment_summary
tool: Biopython 1.84 (Bio.AlignIO)
summary: Count the sequences and columns of an alignment.
usage: |
  Use to get the dimensions of a multiple sequence alignment.
inputs:
  aln: mafft_alignment
outputs:
  summary: alignment_columns_summary
interpreter: python
script: |
  import os
  from Bio import AlignIO
  a = AlignIO.read(os.environ["IN_aln"], "fasta")
  with open(os.environ["OUT_summary"], "w") as f:
      f.write("n_sequences\tn_columns\n%d\t%d\n" % (len(a), a.get_alignment_length()))
