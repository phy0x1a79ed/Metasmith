# The Engcyc pipeline against its four sources, one row per stage. page/build.py renders it into the
# artifact, and PIPELINE.md is generated from it, so edit the tables here.
#
# A cell is text. "=" means the same tool and version as Engcyc, "= ?" the same tool with no recorded
# version, and "-" a stage the source did not run. `diff: true` marks a row where Engcyc departs from at
# least one source that ran the stage. `open` names the gate question (U1-U6) a row depends on.

columns:
  engcyc: Engcyc
  e5: E5
  sl_metag: SL metag
  sl_virome: SL virome
  cyanoverse: Cyanoverse

sources:
  engcyc: metasmith 0.25.0 (RC 0.25.0+28ecc51) and its standard-library pins
  e5: the bench-E5 run as it ran, on its bench library (0.22.1 agent)
  sl_metag: the Spanish Lakes metasmith runs W1-W4 on metasmith-libraries v0.18.8; the river samples ran the same way
  sl_virome: Antonio Castellano's 40-step viromics workflow, at the versions in his table
  cyanoverse: the v2 catalogue; "AB48" marks where the AB48 single-sample run differs

groups:
  - name: Front end
    note: per sample
    rows:
      - stage: Read stats
        engcyc: seqkit 2.13.0
        e5: "="
        sl_metag: "="
        sl_virome: FastQC 0.12.1
        cyanoverse: "-"
      - stage: Read QC
        diff: true
        engcyc: BBDuk (BBTools 39.49), JGI settings
        e5: "="
        sl_metag: "= ?"
        sl_virome: Trimmomatic 0.39
        cyanoverse: QC-filtered reads (tool not recorded)
      - stage: Long-read filter
        engcyc: Filtlong 0.3.1 (ONT, CLR)
        e5: "="
        sl_metag: "-"
        sl_virome: "-"
        cyanoverse: "-"
      - stage: Short-read assembly
        diff: true
        open: U2
        engcyc: MEGAHIT 1.2.9
        e5: "="
        sl_metag: "= ?"
        sl_virome: metaSPAdes 4.2.0 + MEGAHIT 1.1.3, pooled
        cyanoverse: MEGAHIT (version not recorded)
      - stage: Hybrid assembly
        diff: true
        engcyc: imported from E5 (OPERA-MS 0.9.0); no de novo hybrid lane in 0.25.0
        e5: OPERA-MS 0.9.0, no polishing
        sl_metag: "-"
        sl_virome: "-"
        cyanoverse: "-"
      - stage: HiFi assembly
        diff: true
        engcyc: hifiasm-meta hamtv0.3.5
        e5: "-"
        sl_metag: "-"
        sl_virome: "-"
        cyanoverse: "AB48: ="
      - stage: Noisy long-read assembly
        engcyc: Flye 2.9.6 --meta
        e5: "="
        sl_metag: "-"
        sl_virome: "-"
        cyanoverse: "-"
      - stage: Mapping, coverage
        diff: true
        engcyc: minimap2 2.31 + samtools 1.23.1 (one image) + bedtools 2.27.1
        e5: same tools at the 0.22.1 pins
        sl_metag: "= ?"
        sl_virome: minimap2 + samtools 1.20 BAMs; CoverM 0.7.0 contig mode
        cyanoverse: coverage table (tool not recorded)
      - stage: ORFs
        engcyc: pprodigal 1.0.1 (Prodigal 2.6.3, -p meta, -C 100)
        e5: "="
        sl_metag: "="
        sl_virome: "-"
        cyanoverse: Prodigal 2.6.3
      - stage: Read taxonomy
        diff: true
        open: U5
        engcyc: phyloFlash 3.4.2 (short reads)
        e5: "-"
        sl_metag: kraken2 + bracken, centrifuger, ganon2, MetaPhlAn, sylph (GTDB r232), phyloFlash
        sl_virome: "-"
        cyanoverse: "-"
      - stage: Contig taxonomy
        diff: true
        open: U11
        engcyc: Metabuli 1.2.0 (GTDB r232), then a contig LCA* vote over UniRef50 hits (5 per ORF), rRNA calls and Metabuli, all mapped to GTDB r232 first
        e5: "-"
        sl_metag: "Metabuli = ?"
        sl_virome: "-"
        cyanoverse: "= (AB48: r232)"

  - name: Binning and genomes
    note: per sample
    rows:
      - stage: Binners
        diff: true
        engcyc: MetaBAT2 2.17, SemiBin2 2.1.0 (global), COMEBin 1.0.4 (CPU lane, 48 cpu)
        e5: "= (COMEBin at 24 cpu)"
        sl_metag: "= (COMEBin on the GPU image)"
        sl_virome: MetaBAT2 2.18, MaxBin2 2.2.7, CONCOCT 1.1.0, BinSanity, ABAWACA
        cyanoverse: "="
      - stage: Bin selection
        diff: true
        open: U1
        engcyc: CheckM2 filter (completeness >= 50, contamination <= 10) over all three binners, then skani 0.2.2 dedup
        e5: DAS Tool 1.1.7
        sl_metag: "= (skani across all samples)"
        sl_virome: metaWRAP 1.3.2 refine, then dRep 3.4.0
        cyanoverse: "AB48: ="
      - stage: MAG quality
        engcyc: CheckM2 1.1.0
        e5: "= (DB release not recorded)"
        sl_metag: "="
        sl_virome: CheckM2 1.1.0
        cyanoverse: "="
      - stage: MAG taxonomy
        diff: true
        engcyc: GTDB-Tk 2.7.2 (digest pin), r232, ANI screen on, on every quality MAG
        e5: "- (2.6.1 r232 defined, never ran)"
        sl_metag: "= r232, per binner"
        sl_virome: GTDB-Tk v2, r214
        cyanoverse: "AB48: ="
      - stage: MAG abundance
        diff: true
        engcyc: own-assembly coverage
        e5: own-assembly coverage
        sl_metag: own-assembly coverage
        sl_virome: CoverM 0.7.0 genome mode
        cyanoverse: "-"
      - stage: GEMs
        diff: true
        open: U13
        engcyc: "CarveMe 1.6.6 (now the library pin), SCIP gap fill, M8 medium, on every quality MAG. Split at the BiGG DIAMOND search, so hits are cached and carving reruns alone (Tony). A second lane carves from the 4-lane GPR calls (Tony, U13)"
        e5: "= (on DAS Tool MAGs)"
        sl_metag: "-"
        sl_virome: "-"
        cyanoverse: "-"
      - stage: GEM score
        engcyc: MEMOTE 0.17.0
        e5: "="
        sl_metag: "-"
        sl_virome: "-"
        cyanoverse: "-"
      - stage: Strain profiles
        diff: true
        engcyc: "-"
        e5: "-"
        sl_metag: inStrain (W4)
        sl_virome: MetaPop 0.0.48
        cyanoverse: "-"

  - name: Viral lane
    note: callers per sample, catalogue tools once per dataset on the merged, frozen candidate set
    rows:
      - stage: Callers
        diff: true
        open: U3
        engcyc: geNomad 1.11.0, VirSorter2 2.2.4, VIBRANT 1.2.1
        e5: "= + DeepVirFinder 0.1"
        sl_metag: geNomad, VirSorter2 (W4)
        sl_virome: geNomad 1.5.1 only
        cyanoverse: geNomad (version not recorded), partial VirSorter2
      - stage: Pool and dereplicate
        engcyc: merge_candidate_calls, per dataset
        e5: viral_merge_calls, per study
        sl_metag: "-"
        sl_virome: SeqKit pool of both assemblies >= 1 kb, then MMseqs2 pre-cluster
        cyanoverse: "-"
      - stage: Quality, provirus trim
        engcyc: CheckV 1.0.3, DB v1.5
        e5: "= (DB release not recorded)"
        sl_metag: "-"
        sl_virome: CheckV 1.0.1, DB v1.5
        cyanoverse: "-"
      - stage: vOTU clustering
        diff: true
        engcyc: MMseqs2 17.b804f, 95 % id, 80 % cov, cov-mode 1
        e5: "= but cov-mode 0"
        sl_metag: "-"
        sl_virome: "="
        cyanoverse: "-"
      - stage: Island filter >= 100 kb
        diff: true
        engcyc: a join over the geNomad and length tables, after the DAG
        e5: votu_island_annotate (geNomad annotate + regex)
        sl_metag: "-"
        sl_virome: python regex
        cyanoverse: "-"
      - stage: Viral taxonomy
        engcyc: geNomad ICTV + vConTACT3 3.1.4 (DB v230)
        e5: geNomad only
        sl_metag: geNomad
        sl_virome: "="
        cyanoverse: "-"
      - stage: Host prediction
        diff: true
        engcyc: iPHoP 1.4.2, Jun25_rw (GTDB r226) + own MAGs via GTDB-Tk de_novo_wf
        e5: "-"
        sl_metag: "-"
        sl_virome: iPHoP ("1.8.0" in his table), Jun_2025_pub_rw
        cyanoverse: "-"
      - stage: CRISPR spacers
        engcyc: CCTyper 1.8.0 on quality MAGs + blastn-short 2.16.0
        e5: "-"
        sl_metag: "-"
        sl_virome: CCTyper + blastn 2.13.0
        cyanoverse: "-"
      - stage: AMGs
        engcyc: DRAM-v 1.5.0 (kofam, pfam, dbCAN)
        e5: "-"
        sl_metag: "-"
        sl_virome: DRAM-v 1.5.0 (+ MEROPS, VOGDB, viral RefSeq)
        cyanoverse: partial DRAM-v
      - stage: Viral KOs
        diff: true
        engcyc: KOfamScan 1.3.0 on the whole-assembly ORFs, joined to vOTUs by provenance
        e5: "-"
        sl_metag: "-"
        sl_virome: KEGG Mapper (web)
        cyanoverse: "-"
      - stage: vOTU abundance
        diff: true
        engcyc: own-assembly coverage, joined by provenance
        e5: "-"
        sl_metag: "-"
        sl_virome: CoverM 0.7.0 contig mode
        cyanoverse: "-"

  - name: Annotation layer
    note: on whole-assembly ORFs
    rows:
      - stage: 4-lane GPR
        diff: true
        open: U4
        engcyc: KOfamScan 1.3.0, CLEAN 2026.06.14 (CPU or GPU, U10), DIAMOND 2.1.8 + UniRef50 2026_02 with 5 hits per ORF (the GPR keeps the best), ProteinBERT 2024.03.28, folded to MetaNetX 4.5
        e5: "-"
        sl_metag: KOfamScan and DIAMOND UniRef50 only
        sl_virome: "-"
        cyanoverse: "= but DIAMOND kept 1 hit per ORF, so its 99M ORFs are searched again"
      - stage: Domains
        engcyc: InterProScan 5.67-99.0
        e5: "-"
        sl_metag: "= ?"
        sl_virome: "-"
        cyanoverse: "="
      - stage: ncRNA, tRNA, CRISPR
        engcyc: Bakta 1.11.0 --skip-cds, db-light
        e5: "-"
        sl_metag: "= ?"
        sl_virome: "-"
        cyanoverse: "="
      - stage: tRNA
        diff: true
        engcyc: ARAGORN 1.2.41 (tRNAscan-SE agreed on 95% of calls at 150x the CPU)
        e5: "-"
        sl_metag: "-"
        sl_virome: "-"
        cyanoverse: "Bakta's tRNA calls"
      - stage: rRNA and its taxonomy
        diff: true
        engcyc: barrnap 0.9, then BLAST 2.16.0 against GTDB r232 SSU and LSU
        e5: "-"
        sl_metag: "-"
        sl_virome: "-"
        cyanoverse: "Bakta's rRNA calls, no taxonomy"
      - stage: EC consensus
        diff: true
        engcyc: "- (removed, Tony 2026-10-22)"
        e5: "-"
        sl_metag: "-"
        sl_virome: "-"
        cyanoverse: "LCA* port that picks the minority branch on split votes"
      - stage: Pathways
        diff: true
        engcyc: "PathoLogic (Pathway Tools 27.0, licensed fir SIF sha256 86fd8d9c) per assembly and per quality MAG, from CLEAN's EC calls above the score floor"
        e5: "-"
        sl_metag: "-"
        sl_virome: "-"
        cyanoverse: "-"
      - stage: BGCs
        engcyc: antiSMASH 7.1.0
        e5: "-"
        sl_metag: "= ?"
        sl_virome: "-"
        cyanoverse: "= (539 of 2,844 ingested)"
      - stage: EC numbers, second caller
        engcyc: "- (CLEAN in the GPR covers EC numbers)"
        e5: "-"
        sl_metag: DeepEC (version not recorded)
        sl_virome: "-"
        cyanoverse: DeepEC 0.4.1
        diff: true
      - stage: Marker completeness
        engcyc: BUSCO 5.8.3, bacteria_odb10
        e5: "-"
        sl_metag: "= ?"
        sl_virome: "-"
        cyanoverse: "="
      - stage: Phylogenetic placement of marker genes
        diff: true
        open: U14
        engcyc: "- (deferred, Tony 2026-10-22: add later as a targeted lane once a package set is chosen) (U14)"
        e5: "-"
        sl_metag: "- (per-study TreeSAPP work sits on chinook, outside W1-W4)"
        sl_virome: "-"
        cyanoverse: "-"
      - stage: Transcription factors
        engcyc: PredicTF 1.0
        e5: "-"
        sl_metag: "= ?"
        sl_virome: "-"
        cyanoverse: "="
      - stage: Orthologs
        diff: true
        open: U4
        engcyc: "-"
        e5: "-"
        sl_metag: EggNOG-mapper 2.1.12
        sl_virome: "-"
        cyanoverse: incomplete
      - stage: TFs, deep model
        diff: true
        open: U4
        engcyc: "-"
        e5: "-"
        sl_metag: "DeepTFactor 1.0, 98 of 101 samples after chunking (W2)"
        sl_virome: "-"
        cyanoverse: "DeepTFactor, incomplete: 2,818 of 2,844 after wall-time kills and a reset that lost 2,821 results"
      - stage: Promoters
        diff: true
        open: U4
        engcyc: "-"
        e5: "-"
        sl_metag: PromoTech 1.0
        sl_virome: "-"
        cyanoverse: partial
      - stage: AMR, virulence, MGEs
        diff: true
        engcyc: "BacMet (DIAMOND 2.1.8) on the ORFs, plus geNomad 1.11.0's plasmid calls. RGI, AMRFinderPlus, VFDB, MEGARes, PathoFact, IntegronFinder, MobileElementFinder and crAssphage run only for a dataset that asks (Tony)"
        e5: "-"
        sl_metag: "W4: RGI 6.0.8, AMRFinderPlus, BacMet, VFDB, MEGARes, PathoFact, IntegronFinder, MobileElementFinder, crAssphage"
        sl_virome: "-"
        cyanoverse: "-"
      - stage: MAG annotation
        diff: true
        engcyc: via the ORF join (mag_orfs)
        e5: CarveMe BiGG DIAMOND
        sl_metag: "-"
        sl_virome: DRAM 1.5.0
        cyanoverse: "-"

  - name: Output layout
    open: U6
    rows:
      - stage: Unit
        engcyc: one folder per dataset, as LAYOUT.md (engcyc portal draft, feat/engcyc/omd-mp) defines
        e5: one metasmith run per batch
        sl_metag: one publish dir per study
        sl_virome: "- (never ran in metasmith)"
        cyanoverse: one catalogue
      - stage: Files
        engcyc: "<subject>/<product>/<stem>[.<set>].<ext>; bins <sample>.<binner>.NNN; once-per-dataset products under the dataset id"
        e5: results/<namespace-type>/<instance>.<ext>, hashed names
        sl_metag: assemblies/, orfs/, binning/fna_<binner>/, taxonomy_reads/<tool>_<product>/
        sl_virome: "-"
        cyanoverse: <namespace-type>/<SRA>.<ext>
      - stage: Pooled tables
        engcyc: tables/ with summary tables only (contig_stats, mags, votus, gpr parquet)
        e5: results/e5/*.tsv
        sl_metag: per-tool TSVs
        sl_virome: "-"
        cyanoverse: contig_stats.parquet, DuckDB per annotator
      - stage: Logs
        engcyc: "_logs/: ledger.tsv (one row per file, imported or regenerated, with sha256), gaps.tsv, runs/<run>.tar.gz"
        e5: run dir
        sl_metag: _logs/<run>/ + tarball
        sl_virome: "-"
        cyanoverse: "-"

open:
  U1: "Bin selection: the CheckM2 filter with skani dedup (Cyanoverse AB48, SL metag, 0.25.0), with E5's DAS Tool MAGs imported only as extras? Recommended. The other choice is DAS Tool everywhere, which matches E5's 24,087 MAGs but not the Cyanoverse layout."
  U2: "Virome assembly: MEGAHIT only, as E5, SL metag and the viromics port do? Recommended for the pilot. Antonio pooled metaSPAdes 4.2.0 and MEGAHIT contigs."
  U3: "Viral callers: geNomad, VirSorter2 and VIBRANT (the standard library)? Recommended. E5 also pooled DeepVirFinder, and Antonio called with geNomad alone."
  U4: "Annotation layer: the 4-lane GPR plus InterProScan, Bakta (ncRNA), antiSMASH, BUSCO and PredicTF? DeepEC is dropped (Tony, 2026-10-20), since CLEAN already calls EC numbers. The other choices are GPR only, or adding EggNOG-mapper, DeepTFactor and PromoTech as SL metag did."
  U5: "Spanish Lakes read classifiers (kraken2, centrifuger, ganon2, MetaPhlAn, sylph): leave them out of the initial pipeline, keeping their results importable for the SL datasets? Recommended. The AMR half is decided: BacMet everywhere, geNomad plasmids, the rest on request."
  U6: "Output layout: adopt LAYOUT.md, the engcyc portal session's draft on feat/engcyc/omd-mp, as the contract (recommended)? It leaves two choices to you: grouping by subject or by data type, and the tables/ and _logs/ convention. MAG naming and the AMR subjects are settled."
  U7: "The 101 Spanish Lakes samples: the manifest flags them as viral-fraction metagenomes, yet SL metag W3 binned them into 31,149 bins. Run them as the full short-read shape, importing W1-W3 (recommended), or as the virome shape with no MAG lane?"
  U8: "Duplicate MAGs: skani only labels the 95% ANI clusters, so a genome all three binners recover reaches GTDB-Tk and CarveMe up to three times. Pass only the 95% centroids downstream (recommended, one small new transform), or keep every quality bin?"
  U9: "Host prediction for datasets that are not binned: iPHoP needs our own MAGs in its database and CCTyper reads the MAGs, so these datasets get no host predictions or spacer links. Leave it that way (the plan as drawn), or add iPHoP on the stock Jun25_rw database and CCTyper on the whole assembly?"
  U10: "CLEAN lane, measured on fir with real ESM-1b and equal accuracy everywhere (DH10B F1 0.929-0.930). A 48-core CPU task (bf16, 6x8 pinned workers) is 1.2-1.6x slower than one 3g.40gb GPU slice in fp32 and 4.5-5.6x slower than the slice in bf16; a full 192-core node is 1.4-1.5x slower than a bf16 slice. In core-hours CPU costs 17-20x the fp32 GPU lane and 63-74x a bf16 GPU lane (COMEBin moved to CPU at 23x). Nothing below bf16 beats it, on CPU (int8, int4, ONNX int8) or on the GPU (fp8, int8 and int4 through torchao, eager or compiled; tested 2026-10-26): each is slower than bf16 or moves 2-12% of the kept EC sets on metagenome ORFs, against 0.75% for bf16. Engcyc after ORF centroid dedup: GPU bf16 on 1g.10gb slices about 115 slice-hours, or CPU about 30,000 core-hours (about 15 h on 2,000 cores). Which lane?"
  U11: "Metabuli GTDB r232. Inodes are not the cost: a Metabuli index is about a dozen files (fir's GTDB 214.1 copy is 11 files, 101 GB), so r232 is about 12 files and 744 GB. A hybrid plan is not possible inside one run: a metasmith run drives one agent, and Nextflow needs one shared work dir. Hybrid works only as two runs with a seam: export every contig, classify on the Arbutus Metabuli service, import the calls as givens. Arbutus caps at 120 GB RAM, so it streams the index about 7 times per chunk, about 700 s per chunk, one job at a time (parallel workers contend for one Ceph stream). An estimated 360 Gbp of Engcyc contigs would be about 1,000 chunks, about 200 h serial. fir's 768 GB nodes hold the whole index, so a job needs one pass and jobs run in parallel. Recommended: download r232 once into /project/rpp-shallam (35 TiB free, out of reach of scratch purges), streaming the tarball through tar so the peak is 744 GB, not 1.4 TB, and run Metabuli on fir."
  U12: "Reuse rule (Tony: reuse where methods match, regenerate where they differ). Where a source never recorded its tool version (the = ? cells, mostly Spanish Lakes annotation), reuse it or regenerate it?"
  U13: "CarveMe from the 4-lane calls (Tony: test it, report like E4 Fig 1). Two shapes. (a) Score CarveMe's own BiGG universe from the 4-lane calls: translate each ORF's MNXR or EC call to BiGG reactions and pass it as CarveMe's eggNOG-style input, so carving and gap fill stay stock. Needs an MNXR-to-BiGG crosswalk, and BiGG and MetaNetX 4.5 disagree on 1,231 of 2,751 reactions. (b) The library's existing GPR lane: a draft in MetaNetX ids (gem_from_gpr), then CarveMe's biomass, transport and gap fill. On its one test (e_coli_core) both gap fillers came back infeasible. Recommended: (a), tested on the six E. coli strains from mm_compare and a batch of E5 MAGs, scored as reaction Jaccard against the DIAMOND lane and against iML1515, plus MEMOTE by section."
  U14: "TreeSAPP, deferred (Tony 2026-10-22: maybe add later). TreeSAPP is a targeted tool, not a general annotator: it places only the genes of the families it has a reference package for (an HMM, a tree and a placement model each), so it answers questions about chosen marker genes and says nothing about the rest. Nothing in the library runs it. To add it later: pick the gene families the Engcyc questions need, take the curated packages for them (John already builds packages, e.g. the PR_22 rhodopsin package), write one transform for treesapp assign on the pipeline's ORFs, and time one sample on fir."

# One entry per read shape the driver solves. `datasets` names the manifest rows that take the shape.
shapes:
  short_pe:
    title: Short reads, paired
    front: seqkit, BBDuk, MEGAHIT
    datasets: metaGEM PE studies, Pratama short, Anaerobic digester, Mycopots, Copper, Lung WGA, Saanich, Line P, Spanish lake and river
  short_se:
    title: Short reads, single-end
    front: seqkit, BBDuk, MEGAHIT
    datasets: korem2015
  long_hifi:
    title: PacBio HiFi
    front: seqkit, hifiasm-meta
    datasets: ab48_revio, revio_2024_metagenomes
  long_noisy:
    title: Nanopore or PacBio CLR
    front: seqkit, Filtlong, Flye --meta
    datasets: CAMI II marine and strain (PacBio CLR alone)
  virome_pe:
    title: Virome, paired
    front: seqkit, BBDuk, MEGAHIT; viral lane only
    datasets: spanish_lakes_viromics, if U7 goes that way
  given_assembly:
    title: Existing assembly
    front: imported assembly and reads; no read QC or assembly
    datasets: E5 hybrids (CAMI, Pratama), Spanish Lakes W1, Cyanoverse v2
  given_unbinned:
    title: Existing assembly, not binned
    front: imported assembly; annotation and viral lanes only
    datasets: scadc, and any other dataset that is not a metagenome. Binning runs only on metagenomes.

# What solving the pipeline on 0.25.0 changed, for the gate.
findings:
  - title: GTDB-Tk and CarveMe now run on every quality MAG
    body: In 0.25.0 nothing per-genome reads the aggregator's pool, so GTDB-Tk and the GEM lane could only take one binner's bins. Two new transforms, gtdbtk_quality and prodigal_from_quality_bin, read the pool directly. Retyping the pool as a genome instead makes the solve cycle, because CheckM2 on the pool then satisfies the aggregator's own inputs.
  - title: iPHoP's tree is built from the MAGs it adds
    body: gtdbtk_de_novo took any genome set and settled on DAS Tool's bins, while iphop_add_to_db added the quality MAGs. The trees then do not describe the genomes being added. gtdbtk_de_novo_quality builds the tree from the quality pool, and DAS Tool leaves the plan.
  - title: Annotators read prodigal's whole-assembly ORFs
    body: prodigal-gv's ORFs on the viral frozen set also descend from the assembly, and the solver fed them to the GPR lanes and four annotators. prodigal-gv is out. Viral KOs are the assembly KOfam calls joined to vOTUs, and the driver fails any plan whose ORFs do not come from prodigal.
  - title: The de novo tree takes days
    body: GTDB-Tk de_novo_wf infers a FastTree over about 190,000 taxa, once per dataset, near fir's 7-day limit. Only iPHoP's MAG-augmented host database needs it. Running iPHoP against the stock Jun25_rw database removes it.
  - title: DIAMOND keeps 5 hits everywhere
    body: Tony standardised every Engcyc collection on 5 UniRef50 hits per ORF, which the contig LCA* vote needs. The GPR still reads the best hit. Results searched with 1 hit, including Cyanoverse's 99M ORFs, are imported under a legacy type, so the plan searches them again.
  - title: The MetaPathways stage is in the plan
    body: "The metapathways session's transforms solve in every shape: ARAGORN tRNAs, barrnap rRNAs with GTDB taxonomy, a contig LCA* vote and PathoLogic PGDBs per assembly and per quality MAG. CarveMe 1.6.6 is now the library pin. On the SG8W14 pilot, PathoLogic took 3.7 GB and 30 min per assembly and about 2.5 min per MAG, and CarveMe 1.3 GB and about 11 min per MAG."
  - title: GTDB-Tk on the quality pool has its own type
    body: As a second producer of taxonomy::gtdbtk, gtdbtk_quality answered the per-binner GTDB-Tk targets of the shipped metagenomics_from_paired_reads template, which stopped solving. Its product is now taxonomy::gtdbtk_quality, and all 12 templates build.
  - title: No de novo hybrid lane
    body: OPERA-MS is only in E5's bench library. Every hybrid dataset already has an E5 assembly, so hybrids enter as the existing-assembly shape.
