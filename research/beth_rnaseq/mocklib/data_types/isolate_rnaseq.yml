# generated by research/beth_rnaseq/mocklib/generate.py -- do not hand-edit
types:
  sample_sheet:
    properties:
      _: 'one row per RNA library: library and copper dose in ppm'
      ext: tsv
  rrna_fraction:
    properties:
      _: per-sample fraction of read pairs on rRNA and tRNA features
      ext: tsv
  featurecounts_sweep:
    properties:
      _: featureCounts run at each strandedness setting (-s 0, 1, 2)
  strandedness_report:
    properties:
      _: assignment rate per strandedness setting and the setting chosen
      ext: tsv
  raw_count_table:
    properties:
      _: gene by library read-pair counts, columns named by library
      ext: csv
  tpm_table:
    properties:
      _: gene by library TPM, normalised on gene length
      ext: tsv
  dose_trend_results:
    properties:
      _: 'per gene: log2 fold change per 10x copper with its adjusted p-value, and each dose against 0 ppm'
      ext: csv
  dose_trend_plot:
    properties:
      _: volcano of the copper dose trend
      ext: svg
  metal_gene_panel:
    properties:
      _: TPM and dose trend of the genes BacMet assigns to metal resistance, across the copper series
      ext: svg
  qc_report:
    properties:
      _: 'one RNA-seq QC report: trimming, mapping, rRNA, strandedness'
      ext: html
