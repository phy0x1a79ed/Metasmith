<title>Geospatial Query</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one column of survey-sheet panels, scrolled vertically. */
:root {
  --paper: #f3f4ef;
  --panel: #fbfbf8;
  --ink: #1d2420;
  --muted: #66706a;
  --rule: #d5d9d1;
  --accent: #2f6b4f;
  --code: #eef0ea;
  --f1: #b5543c; --f2: #7d6a58; --f3: #c48a1f; --f4: #4f8a3a; --f5: #8c6b3e;
  --f6: #9b4f7a; --f7: #3f7fa8; --f8: #6a5fb0; --f9: #2f8f8f; --f10: #55606a;
  --display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --body: "IBM Plex Sans", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #141816; --panel: #1b201d; --ink: #e4e8e2; --muted: #98a29b; --rule: #2e3531; --accent: #7cc49f; --code: #222824;
    --f1: #e07a60; --f2: #b09a86; --f3: #e2ae4a; --f4: #82bd6a; --f5: #c49b66;
    --f6: #cf7fac; --f7: #6fb0d8; --f8: #9d92e0; --f9: #5cc2c2; --f10: #9aa6b0;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #141816; --panel: #1b201d; --ink: #e4e8e2; --muted: #98a29b; --rule: #2e3531; --accent: #7cc49f; --code: #222824;
  --f1: #e07a60; --f2: #b09a86; --f3: #e2ae4a; --f4: #82bd6a; --f5: #c49b66;
  --f6: #cf7fac; --f7: #6fb0d8; --f8: #9d92e0; --f9: #5cc2c2; --f10: #9aa6b0;
}
body { background: var(--paper); color: var(--ink); font-family: var(--body); }
.sheet {
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px;
  max-width: 920px; margin: 0 auto; padding-block: 20px 32px; padding-inline: 20px;
}
.bar { display: flex; justify-content: flex-end; }
.toggle {
  display: grid; place-items: center; width: 34px; height: 34px; padding: 0; cursor: pointer;
  color: var(--ink); background: var(--panel); border: 1px solid var(--rule); border-radius: 50%;
}
.toggle svg { width: 17px; height: 17px; }
.toggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.toggle .sun { display: none; }
:root[data-dark] .toggle .sun { display: block; }
:root[data-dark] .toggle .moon { display: none; }

.panel {
  background: var(--panel); border: 1px solid var(--rule); border-radius: 3px;
  padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0;
}
.panel h2 {
  margin: 0; font-family: var(--display); font-weight: 600; font-size: 15px;
  letter-spacing: .14em; text-transform: uppercase; color: var(--muted);
  display: flex; gap: 10px; align-items: baseline;
}
.panel h2 b { color: var(--accent); font-weight: 600; }
.panel h3 { margin: 0; font-family: var(--display); font-weight: 600; font-size: 20px; letter-spacing: .02em; }
.vibe img { display: block; width: 100%; height: auto; border-radius: 2px; background: #fff; }

/* Signature */
.sig { display: grid; gap: 4px; }
.sig h3 { margin-top: 12px; }
.sig > ul { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; }
.def { scroll-margin-top: 16px; }
.def > div { font-size: 14px; }
.def > div b { font-family: var(--mono); font-weight: 500; color: var(--accent); }
.def > div i { font-style: normal; color: var(--muted); font-size: 12.5px; }
.def ul { margin: 4px 0 0; padding-left: 22px; display: grid; gap: 2px; font-size: 13px; }
.def li::marker { color: var(--muted); }
.def code { font-family: var(--mono); font-size: 12.5px; }
.def .t { color: var(--f1); }
.def a { color: inherit; text-decoration: none; border-bottom: 1px dotted currentColor; }
.def:target > div b { text-decoration: underline; }

/* Feature set */
#bars { width: 100%; height: 320px; }
.fams { display: grid; gap: 0; border-top: 1px solid var(--rule); }
.fams details { border-bottom: 1px solid var(--rule); }
.fams summary {
  display: flex; align-items: center; gap: 10px; padding: 9px 2px; cursor: pointer; list-style: none; font-size: 14px;
}
.fams summary::-webkit-details-marker { display: none; }
.fams summary::before { content: "▸"; font-size: 11px; color: var(--muted); width: 10px; }
.fams details[open] summary::before { content: "▾"; }
.fams summary:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.fams summary .count { margin-left: auto; font-family: var(--mono); font-size: 12px; color: var(--muted); }
.table { overflow-x: auto; padding-bottom: 10px; }
.table table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
.table th { text-align: left; font-family: var(--display); font-weight: 600; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding: 6px 10px 6px 0; border-bottom: 1px solid var(--rule); }
.table td { padding: 4px 10px 4px 0; vertical-align: top; border-bottom: 1px solid var(--code); }
.table td:first-child, .table td:last-child { font-family: var(--mono); font-size: 12px; white-space: nowrap; }
.table td:last-child { color: var(--muted); }

/* Method */
.driver { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; font-family: var(--mono); font-size: 12.5px; }
.driver span { padding: 4px 10px; border: 1px solid var(--rule); border-radius: 2px; }
.driver span.on { border-color: var(--accent); color: var(--accent); }
.driver i { color: var(--muted); font-style: normal; }
.dag { overflow-x: auto; }
.dag svg { display: block; margin: 0 auto; max-width: 100%; height: auto; }
.dag .dark { display: none; }
:root[data-dark] .dag .light { display: none; }
:root[data-dark] .dag .dark { display: block; }
.dag text { font-family: var(--mono); }
</style>

<main class="sheet">
  <div class="bar">
    <button class="toggle" id="theme" type="button" aria-label="Toggle light and dark theme">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 1.5v2.5M12 20v2.5M1.5 12H4M20 12h2.5M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>
    </button>
  </div>

  <section class="panel">
    <h2><b>1</b>Abstract</h2>
    <div class="vibe"><img src="vibe.svg" alt="Vibe abstract collage"></div>
  </section>

  <section class="panel">
    <h2><b>2</b>Pipeline signature</h2>
    <div class="sig" id="sig"></div>
  </section>

  <section class="panel">
    <h2><b>3</b>Feature set</h2>
    <div id="bars"></div>
    <div class="fams" id="fams"></div>
  </section>

  <section class="panel">
    <h2><b>4</b>Method</h2>
    <div class="driver"><span class="on">metasmith plan</span><i>→</i><span>Nextflow driver</span><i>→</i><span>1 task per source, all AOIs</span></div>
    <div class="dag"><div class="light"><!--DAG-LIGHT--></div><div class="dark"><!--DAG-DARK--></div></div>
  </section>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.34.0/plotly.min.js"></script>
<script>
const DATA = /*FEATURES*/[];

const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);

const SPEC = [
  { group: "Definitions", types: [
    { name: "Point", kind: "made of", rows: [["longitude", "float"], ["latitude", "float"]] },
    { name: "AOI", kind: "made of", rows: [["outline", "list of Point"]] },
    { name: "FeatureFamily", kind: "one of", opts: ["socio-economic", "infrastructure", "hazards", "macrobiology",
      "geology", "microbiology-health", "climate", "spectral", "water", "latent"] },
    { name: "Licence", kind: "one of", opts: ["permissive", "share-alike", "noncommercial", "restricted"] },
    { name: "Feature", kind: "made of", rows: [
      ["feature", "text"], ["value", "any"], ["SI_unit", "text"], ["family", "FeatureFamily"], ["time", "Time"]] },
    { name: "Error", kind: "made of", rows: [
      ["feature", "text"], ["family", "FeatureFamily"], ["time", "Time"], ["message", "text"]] },
  ] },
  { group: "Input", types: [
    { name: "Query", kind: "made of", rows: [
      ["aoi", "AOI"], ["time", "Time"], ["time_tolerance", "Duration"],
      ["feature_families", "list of FeatureFamily"], ["licence", "Licence"]] },
  ] },
  { group: "Output", types: [
    { name: "QueryResult", kind: "made of", rows: [
      ["aoi", "AOI"], ["features", "list of Feature"], ["errors", "list of Error"]] },
  ] },
];

const NAMES = new Set(SPEC.flatMap(g => g.types.map(t => t.name)));
const link = txt => esc(txt).replace(/\b[A-Za-z_]+\b/g, w => NAMES.has(w) ? `<a href="#t-${w}">${w}</a>` : w);
const def = t => `<li class="def" id="t-${t.name}">
  <div><b>${t.name}</b> <i>${t.kind}</i></div>
  <ul>${t.opts
    ? t.opts.map(o => `<li><code class="t">${esc(o)}</code></li>`).join("")
    : t.rows.map(([f, ty]) => `<li><code>${esc(f)}</code>: <code class="t">${link(ty)}</code></li>`).join("")}</ul>
</li>`;
document.getElementById("sig").innerHTML =
  SPEC.map(g => `<h3>${g.group}</h3><ul>${g.types.map(def).join("")}</ul>`).join("");

function drawBars() {
  const css = getComputedStyle(document.documentElement);
  const v = n => css.getPropertyValue(n).trim();
  const rows = [...DATA].reverse();
  const y = rows.map(d => d.family);
  const bar = (x, xaxis, unit) => ({
    type: "bar", orientation: "h", x, y, xaxis, yaxis: "y",
    text: x, textposition: "outside", cliponaxis: false, marker: { color: v("--ink") },
    hovertemplate: `%{y}: %{x} ${unit}<extra></extra>`,
  });
  const axis = (domain, title) => ({
    domain, title: { text: title, standoff: 10, font: { color: v("--muted") } },
    gridcolor: v("--rule"), zeroline: false, tickfont: { color: v("--muted") },
  });
  Plotly.react("bars", [
    bar(rows.map(d => d.features.length), "x", "features"),
    bar(rows.map(d => new Set(d.features.map(f => f.source)).size), "x2", "sources"),
  ], {
    showlegend: false, margin: { l: 190, r: 30, t: 4, b: 48 },
    paper_bgcolor: "rgba(0,0,0,0)", plot_bgcolor: "rgba(0,0,0,0)",
    font: { family: v("--mono"), size: 12, color: v("--ink") },
    xaxis: axis([0, 0.6], "features"), xaxis2: axis([0.68, 1], "sources"),
    yaxis: { automargin: true, tickfont: { family: v("--body"), size: 13 } },
    bargap: 0.35,
  }, { displayModeBar: false, responsive: true });
}

document.getElementById("fams").innerHTML = DATA.map((d, i) =>
  `<details id="fam-${i}">
     <summary>${esc(d.family)}<span class="count">${d.features.length}</span></summary>
     <div class="table"><table>
       <thead><tr><th>Feature</th><th>Description</th><th>Source</th></tr></thead>
       <tbody>${d.features.map(f => `<tr><td>${esc(f.name)}</td><td>${esc(f.description)}</td><td>${esc(f.source)}</td></tr>`).join("")}</tbody>
     </table></div>
   </details>`).join("");

const root = document.documentElement, btn = document.getElementById("theme");
const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
const paint = () => { root.toggleAttribute("data-dark", isDark()); if (window.Plotly) drawBars(); };
try { const t = localStorage.getItem("gq-theme"); if (t) root.dataset.theme = t; } catch (e) {}
btn.addEventListener("click", () => {
  root.dataset.theme = isDark() ? "light" : "dark";
  try { localStorage.setItem("gq-theme", root.dataset.theme); } catch (e) {}
  paint();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", paint);
paint();
</script>
