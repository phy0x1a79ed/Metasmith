<title>SCADC Lipidome Ordination</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* layout: one grid, rows = observations, columns = B PCA and MI MDS by colouring, legend pinned under the header, checks table last */
:root {
  --bg: #f6f7f8; --surface: #ffffff; --fg: #1d2126; --muted: #5d6670; --rule: #dde1e6;
  --s1: #2a78d6; --s2: #1597a6; --s3: #e8681f; --s4: #d1332a;
  --pass: #1f7a3a; --flag: #a86200; --fail: #b3261e; --neutral: #4b5563;
  --sans: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #121417; --surface: #1a1d21; --fg: #e8eaed; --muted: #9aa3ad; --rule: #2c3138;
  --s1: #3987e5; --s2: #1ea3b3; --s3: #ec7330; --s4: #e04a3c;
  --pass: #5cc27a; --flag: #e0a040; --fail: #f07068; --neutral: #a0a8b2; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #121417; --surface: #1a1d21; --fg: #e8eaed; --muted: #9aa3ad; --rule: #2c3138;
  --s1: #3987e5; --s2: #1ea3b3; --s3: #ec7330; --s4: #e04a3c;
  --pass: #5cc27a; --flag: #e0a040; --fail: #f07068; --neutral: #a0a8b2; color-scheme: dark }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); }
main { max-width: 1180px; margin: 0 auto; padding-block: 16px 48px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
main > *, #variants > *, section.variant > * { min-width: 0; }
header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-size: 1.15rem; font-weight: 600; margin: 0; letter-spacing: .01em; }
h2 { font-size: 1rem; font-weight: 600; margin: 0; }
h2 span { color: var(--muted); font-weight: 400; margin-left: 8px; }
button#theme { background: var(--surface); color: var(--fg); border: 1px solid var(--rule); border-radius: 6px;
  width: 36px; height: 36px; display: grid; place-items: center; cursor: pointer; }
button#theme:focus-visible { outline: 2px solid var(--s1); outline-offset: 2px; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 20px; font-size: .85rem; align-items: center; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { flex: none; }
section.variant { display: grid; gap: 14px; }
.note { margin: 0; font-size: .85rem; color: var(--muted); line-height: 1.5; max-width: 820px; }
.fig { background: var(--surface); border: 1px solid var(--rule); border-radius: 8px; padding: 10px; min-width: 0; overflow-x: auto; }
.plot { width: 100%; min-width: 960px; }
.tablewrap { overflow-x: auto; border: 1px solid var(--rule); border-radius: 8px; background: var(--surface); }
table { border-collapse: collapse; width: 100%; font-size: .8rem; min-width: 1180px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--rule); vertical-align: top; }
th { font-weight: 500; color: var(--muted); font-size: .75rem; text-transform: uppercase; letter-spacing: .06em; }
td.about { color: var(--muted); min-width: 300px; max-width: 380px; line-height: 1.45; }
td.name { font-weight: 500; white-space: nowrap; }
td.v { font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: pre-line; }
tr:last-child td { border-bottom: 0; }
.mark { display: inline-block; margin-top: 4px; font-family: var(--sans); font-size: .7rem; font-weight: 600;
  text-transform: uppercase; letter-spacing: .06em; padding: 1px 6px; border-radius: 4px; border: 1px solid currentColor; }
.mark.pass { color: var(--pass); } .mark.flag { color: var(--flag); } .mark.fail { color: var(--fail); }
.mark.info { color: var(--neutral); }
</style>

<main>
  <header>
    <h1>SCADC lipidome ordination</h1>
    <button id="theme" type="button" aria-label="Toggle light or dark theme"></button>
  </header>
  <div class="legend" id="legend"></div>
  <div id="variants" style="display:grid;grid-template-columns:minmax(0,1fr);gap:28px"></div>
  <section style="display:grid;gap:10px">
    <h2>Checks</h2>
    <div class="tablewrap"><table id="checks"></table></div>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/plotly.js-dist-min@2.35.2/plotly.min.js"></script>
<script>
const DATA = __DATA__;
const STRAINS = ["EPI300", "PCC1", "Clone1", "Clone2"];
const SUN = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>';
const root = document.documentElement;
const css = n => getComputedStyle(root).getPropertyValue(n).trim();
const colour = () => Object.fromEntries(STRAINS.map((s, i) => [s, css(`--s${i + 1}`)]));
const isDark = () => root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;

function legend() {
  const c = colour(), dot = (fill, open) =>
    `<svg width="12" height="12"><circle cx="6" cy="6" r="4.5" fill="${open ? "none" : fill}" stroke="${fill}" stroke-width="1.5"/></svg>`;
  document.getElementById("legend").innerHTML =
    STRAINS.map(s => `<span>${dot(c[s])}${s}</span>`).join("") +
    `<span>${dot(css("--fg"))}tol</span><span>${dot(css("--fg"), true)}ctrl</span>`;
}

const SWAP = { Clone1: "PCC1", PCC1: "Clone1" };
// [figure, colouring, labels exchanged, header]
const COLS = [["B_PCA", "cell type", false, "PCA · B"], ["MI_MDS", "cell type", false, "MDS · MI"],
              ["B_PCA", "cell type", true, "PCA · swap"], ["MI_MDS", "cell type", true, "MDS · swap"],
              ["B_PCA", "treatment", false, "PCA · B"], ["MI_MDS", "treatment", false, "MDS · MI"]];
const CGAP = 0.006, GROUP_GAP = 0.02, W = (1 - 5 * CGAP - GROUP_GAP) / 6;
const XDOM = COLS.map((_, i) => { const x = i * (W + CGAP) + (i >= 4 ? GROUP_GAP : 0); return [x, x + W]; });
const GROUPS = [["cell type", 0, 3], ["treatment", 4, 5]];
const CHI2_95 = 5.991;
const ISO = { yaw: Math.PI / 4, pitch: Math.atan(1 / Math.SQRT2) };  // looking straight at a cube corner
const VIEW = { ...ISO };
const QUARTERS = [0.25, 0.5, 0.75, 1];

function project([x, y, z], view = VIEW) {  // orthographic; third value is depth, positive toward the viewer
  const cy = Math.cos(view.yaw), sy = Math.sin(view.yaw), cp = Math.cos(view.pitch), sp = Math.sin(view.pitch);
  const x1 = x * cy + z * sy, z1 = -x * sy + z * cy;
  return [x1, y * cp - z1 * sp, y * sp + z1 * cp];
}

function hull(pts) {
  const p = [...pts].sort((a, b) => a[0] - b[0] || a[1] - b[1]), cross = (o, a, b) =>
    (a[0] - o[0]) * (b[1] - o[1]) - (a[1] - o[1]) * (b[0] - o[0]);
  const half = q => q.reduce((h, v) => {
    while (h.length > 1 && cross(h[h.length - 2], h[h.length - 1], v) <= 0) h.pop();
    return [...h, v];
  }, []);
  const lo = half(p), up = half(p.reverse());
  return [...lo.slice(0, -1), ...up.slice(0, -1)];
}

function ellipse(cx, cy, a, b, d) {
  const t = (a + d) / 2, r = Math.sqrt(((a - d) / 2) ** 2 + b * b), l1 = t + r, l2 = Math.max(t - r, 0);
  const th = Math.atan2(l1 - a, b || 1e-12), k = Math.sqrt(CHI2_95);
  const xs = [], ys = [];
  for (let i = 0; i <= 48; i++) {
    const u = 2 * Math.PI * i / 48, p = k * Math.sqrt(l1) * Math.cos(u), q = k * Math.sqrt(l2) * Math.sin(u);
    xs.push(cx + p * Math.cos(th) - q * Math.sin(th)); ys.push(cy + p * Math.sin(th) + q * Math.cos(th));
  }
  return [xs, ys];
}

// Per observation: centre the cube on the data's mid-range and flip PC signs (arbitrary in PCA) so the corner view
// shows the largest projected area.
const FRAMES = {};
function frameOf(p) {
  if (FRAMES[p]) return FRAMES[p];
  const f = DATA.figures.B_PCA, pts = f.obs.flatMap((o, i) => o === p ? [[f.x[i], f.y[i], f.z[i]]] : []);
  const lo = [0, 1, 2].map(k => Math.min(...pts.map(q => q[k]))), hi = [0, 1, 2].map(k => Math.max(...pts.map(q => q[k])));
  const mid = lo.map((v, k) => (v + hi[k]) / 2), s = Math.max(...hi.map((v, k) => (v - lo[k]) / 2)) * 1.04;
  // overlap: soft count of projected pairs closer than about one dot width (~0.1 s at the drawn scale)
  let best = { overlap: Infinity };
  for (let n = 0; n < 8; n++) {
    const flip = [n & 1 ? -1 : 1, n & 2 ? -1 : 1, n & 4 ? -1 : 1];
    const pr = pts.map(q => project(q.map((v, k) => (v - mid[k]) * flip[k]), ISO));
    let overlap = 0;
    pr.forEach((a, i) => pr.slice(i + 1).forEach(b =>
      { overlap += Math.exp(-((a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2) / (0.1 * s) ** 2); }));
    if (overlap < best.overlap) best = { overlap, flip };
  }
  return FRAMES[p] = { mid, s, flip: best.flip };
}

// The cube's silhouette and its three back edges (axis lines, behind the dots). Along the leftmost silhouette edge
// parallel to each axis, just outside the outline: that component's share of variance as a bar from the axis' low
// end (full edge = 100%) with ticks at quarters.
function cube(s, pv, ref, rule, muted) {
  const P = [...Array(8)].map((_, n) => project([n & 1 ? s : -s, n & 2 ? s : -s, n & 4 ? s : -s]));
  const back = P.reduce((a, q, n) => q[2] < P[a][2] ? n : a, 0);
  const seg = (a, b, color, width) => ({ type: "line", layer: "below", ...ref,
    x0: a[0], y0: a[1], x1: b[0], y1: b[1], line: { color, width } });
  const h = hull(P.map((q, n) => [q[0], q[1], n]));
  const cx = h.reduce((t, v) => t + v[0], 0) / h.length, cy = h.reduce((t, v) => t + v[1], 0) / h.length;
  const shapes = [{ type: "path", layer: "below", ...ref, line: { color: rule, width: 0.8 },
    path: "M" + h.map(v => `${v[0]},${v[1]}`).join("L") + "Z" }];
  [0, 1, 2].forEach(k => shapes.push(seg(P[back], P[back ^ (1 << k)], rule, 1)));
  const bars = [];
  const edges = h.map((v, i) => [v, h[(i + 1) % h.length]]);
  [0, 1, 2].forEach(k => {
    const along = edges.filter(([a, b]) => (a[2] ^ b[2]) === 1 << k);
    if (!along.length) return;
    const [a, b] = along.reduce((m, e) => e[0][0] + e[1][0] < m[0][0] + m[1][0] ? e : m);
    const [lo, hi] = (a[2] >> k) & 1 ? [b, a] : [a, b];
    const dx = hi[0] - lo[0], dy = hi[1] - lo[1], len = Math.hypot(dx, dy);
    let nx = -dy / len, ny = dx / len;
    if (((lo[0] + hi[0]) / 2 - cx) * nx + ((lo[1] + hi[1]) / 2 - cy) * ny < 0) { nx = -nx; ny = -ny; }
    const at = (t, o) => [lo[0] + dx * t + nx * o * s, lo[1] + dy * t + ny * o * s];
    shapes.push(seg(at(0, 0.1), at(pv[k], 0.1), muted, 3));
    bars.push({ k, pts: [...Array(9)].map((_, j) => at(pv[k] * j / 8, 0.1)) });
    QUARTERS.forEach(q => shapes.push(seg(at(q, 0.05), at(q, 0.15), rule, 1)));
  });
  const pad = 0.17 * s, xs = h.map(v => v[0]), ys = h.map(v => v[1]);
  const backSigns = [0, 1, 2].map(k => (back >> k) & 1 ? 1 : -1);
  return { shapes, bars, back: backSigns, x: [Math.min(...xs) - pad, Math.max(...xs) + pad], y: [Math.min(...ys) - pad, Math.max(...ys) + pad] };
}

// MI distances share units across observations, so every MDS panel gets the same half-width (the largest
// ellipse extent of any observation), centred on its own samples.
let MDS_HALF;
function mdsBox(p) {
  const f = DATA.figures.MI_MDS, k = Math.sqrt(CHI2_95), boxes = {};
  DATA.panels.forEach(o => {
    const ext = f.obs.flatMap((q, i) => q !== o ? [] : [[f.x[i], f.y[i], k * Math.sqrt(f.cxx[i]), k * Math.sqrt(f.cyy[i])]]);
    const x = [Math.min(...ext.map(e => e[0] - e[2])), Math.max(...ext.map(e => e[0] + e[2]))];
    const y = [Math.min(...ext.map(e => e[1] - e[3])), Math.max(...ext.map(e => e[1] + e[3]))];
    boxes[o] = { cx: (x[0] + x[1]) / 2, cy: (y[0] + y[1]) / 2, half: Math.max(x[1] - x[0], y[1] - y[0]) / 2 };
  });
  MDS_HALF ??= Math.max(...Object.values(boxes).map(b => b.half)) * 1.03;
  const b = boxes[p];
  return { x: [b.cx - MDS_HALF, b.cx + MDS_HALF], y: [b.cy - MDS_HALF, b.cy + MDS_HALF] };
}

function figure(el) {
  const c = colour(), fg = css("--fg"), muted = css("--muted"), surface = css("--surface"), rule = css("--muted") + "99";
  const rows = DATA.panels.length, cell = W * (el.clientWidth - 64), gapPx = 8;  // square cells
  const areaH = rows * cell + (rows - 1) * gapPx, h = cell / areaH, gap = gapPx / areaH;
  const label = (text, x, size, color, yshift) => ({ text, xref: "paper", yref: "paper", x, y: 1, yshift,
    xanchor: "center", yanchor: "bottom", showarrow: false, font: { size, color } });
  const traces = [], layout = {
    paper_bgcolor: surface, plot_bgcolor: surface, font: { family: css("--sans"), color: fg, size: 11 },
    height: areaH + 54, margin: { l: 58, r: 6, t: 46, b: 8 }, showlegend: false, hovermode: "closest", dragmode: false, shapes: [],
    hoverlabel: { bgcolor: surface, bordercolor: css("--rule"), font: { color: fg, family: css("--mono") } },
    annotations: [
      ...COLS.map(([, , , head], i) => label(head, (XDOM[i][0] + XDOM[i][1]) / 2, 10, muted, 4)),
      ...GROUPS.map(([g, i, j]) => label(`<b>${g}</b>`, (XDOM[i][0] + XDOM[j][1]) / 2, 11, fg, 22)),
    ],
  };
  DATA.panels.forEach((p, row) => {
    const ydom = [1 - (row + 1) * h - row * gap, 1 - row * h - row * gap];
    const pv = DATA.pca_var[p];
    layout.annotations.push({ text: `<b>${p}</b>  core ${DATA.n_features[p]} · pairs ${DATA.mi_support[p].join("–")}`,
      textangle: -90, xref: "paper", yref: "paper", x: 0, xshift: -44, y: (ydom[0] + ydom[1]) / 2,
      xanchor: "center", yanchor: "middle", showarrow: false, font: { size: 10, color: fg } });
    COLS.forEach(([key, what, swap], col) => {
      const f = DATA.figures[key], mi = key === "MI_MDS", ct = what === "cell type";
      const strain = s => (swap && SWAP[s]) || s;
      const name = i => swap && SWAP[f.strain[i]]
        ? `${f.sample_id[i].replace(f.strain[i], SWAP[f.strain[i]])} (recorded ${f.strain[i]})` : f.sample_id[i];
      const idx = f.obs.map((o, i) => o === p ? i : -1).filter(i => i >= 0);
      const n = row * COLS.length + col + 1, ax = n > 1 ? n : "";
      const axis = (dom, anchor) => ({ domain: dom, anchor, showgrid: false, zeroline: false, showticklabels: false,
        ticks: "", linecolor: css("--rule"), fixedrange: true });
      layout[`xaxis${ax}`] = axis(XDOM[col], `y${ax}`);
      layout[`yaxis${ax}`] = axis(ydom, `x${ax}`);
      if (mi) {
        const mb = mdsBox(p);
        Object.assign(layout[`yaxis${ax}`], { range: mb.y, scaleanchor: `x${ax}`, scaleratio: 1, constrain: "range" });
        Object.assign(layout[`xaxis${ax}`], { range: mb.x, constrain: "range", showline: false });
        layout[`yaxis${ax}`].showline = false;
        idx.forEach(i => {
          const [ex, ey] = ellipse(f.x[i], f.y[i], f.cxx[i], f.cxy[i], f.cyy[i]), col = ct ? c[strain(f.strain[i])] : fg;
          traces.push({ type: "scatter", mode: "lines", xaxis: `x${ax}`, yaxis: `y${ax}`, x: ex, y: ey,
            line: { color: col, width: ct ? 1.2 : 0.9 }, fill: "toself", hoveron: "fills",
            fillcolor: !ct && f.treatment[i] === "tol" ? fg + "55" : "rgba(0,0,0,0)",
            text: name(i), hoverinfo: "text" });
        });
        return;
      }
      const { mid, s, flip } = frameOf(p);
      const pts = idx.map(i => [f.x[i], f.y[i], f.z[i]].map((v, k) => (v - mid[k]) * flip[k]));
      const box = cube(s, pv, { xref: `x${ax}`, yref: `y${ax}` }, rule, muted);
      Object.assign(layout[`xaxis${ax}`], { range: box.x, showline: false, constrain: "range" });
      Object.assign(layout[`yaxis${ax}`], { range: box.y, showline: false, scaleanchor: `x${ax}`, constrain: "range" });
      layout.shapes.push(...box.shapes);
      const hov = box.bars.flatMap(b => b.pts.map(q => [...q, `PC${b.k + 1} · ${(pv[b.k] * 100).toFixed(1)}%`]));
      traces.push({ type: "scatter", mode: "markers", xaxis: `x${ax}`, yaxis: `y${ax}`, marker: { size: 8, opacity: 0 },
        x: hov.map(q => q[0]), y: hov.map(q => q[1]), text: hov.map(q => q[2]), hovertemplate: "%{text}<extra></extra>" });
      const pr = pts.map(q => project(q)), order = pts.map((_, k) => k).sort((a, b) => pr[a][2] - pr[b][2]);
      const at = order.map(k => idx[k]);
      const dotColour = i => ct ? c[strain(f.strain[i])] : fg;
      const drops = {};  // each sample to the nearest back wall, one trace per dot colour
      pts.forEach((q, j) => {
        const k = [0, 1, 2].reduce((a, m) => Math.abs(q[m] - box.back[m] * s) < Math.abs(q[a] - box.back[a] * s) ? m : a, 0);
        const w = [...q]; w[k] = box.back[k] * s;
        const [a, b] = [project(q), project(w)];
        (drops[dotColour(idx[j])] ??= []).push([a[0], a[1]], [b[0], b[1]], [null, null]);
      });
      Object.entries(drops).forEach(([colr, d]) => traces.push({ type: "scatter", mode: "lines", xaxis: `x${ax}`,
        yaxis: `y${ax}`, hoverinfo: "skip", opacity: 0.45, x: d.map(v => v[0]), y: d.map(v => v[1]),
        line: { color: colr, width: 0.8 } }));
      traces.push({
        type: "scatter", mode: "markers", xaxis: `x${ax}`, yaxis: `y${ax}`,
        x: order.map(k => pr[k][0]), y: order.map(k => pr[k][1]), text: at.map(name),
        hovertemplate: "%{text}<extra></extra>",
        marker: {
          size: 5, opacity: 0.75,
          color: at.map(dotColour),
          symbol: at.map(i => ct || f.treatment[i] === "tol" ? "circle" : "circle-open"),
          line: { width: at.map(i => ct || f.treatment[i] === "tol" ? 0 : 1.2), color: fg },
        },
      });
    });
  });
  Plotly.react(el, traces, layout, { displayModeBar: false, responsive: true });
}

function build() {
  const host = document.getElementById("variants");
  host.innerHTML = `
    <section class="variant">
      <p class="note">PCA is core-only CLR (B): species detected in all 24 samples, no zeros imputed. MDS is the
      pairwise mutual-information layout: each pair is compared on the species either sample detects above the pair's
      floor, distance is one minus the permutation-corrected normalised MI, pairs are weighted by bootstrap precision,
      and each ellipse is the 95% region of that sample over ${DATA.n_boot} species bootstraps (wide = little shared
      information). Swap columns exchange the Clone1 and PCC1 colours in every sample; positions are unchanged.
      PCA panels show PC1–PC3 as a cube seen from a corner; drag any of them to rotate all together, double-click to
      reset. The three back edges are the axes; the bars outside the left edges give each
      component's share of variance (full edge = 100%, ticks at quarters). Each row's corner is chosen to overlap the
      samples least. Treatment: filled tol, open ctrl. Row labels give B's core species and the range of species per MI pair.</p>
      <div class="fig"><div class="plot"></div></div></section>`;
  const t = document.getElementById("checks");
  t.innerHTML = `<tr><th>Check</th><th>What it tests · normal result</th>${DATA.panels.map(p => `<th>${p}</th>`).join("")}</tr>` +
    DATA.checks.map(r => `<tr><td class="name">${r.check}</td><td class="about">${r.about}</td>${r.cells.map(c => {
      const cls = ["pass", "flag", "fail"].includes(c.mark) ? c.mark : "info";
      return `<td class="v">${c.value}<br><span class="mark ${cls}">${c.mark}</span></td>`;
    }).join("")}</tr>`).join("");
}

let drag = null, pending = false;
function rotate(e) {
  if (!drag) return;
  VIEW.yaw += (e.clientX - drag[0]) * 0.01;
  VIEW.pitch = Math.max(-1.5, Math.min(1.5, VIEW.pitch + (e.clientY - drag[1]) * 0.01));
  drag = [e.clientX, e.clientY];
  if (!pending) { pending = true; requestAnimationFrame(() => { pending = false; draw(); }); }
}

function draw() {
  document.getElementById("theme").innerHTML = isDark() ? SUN : MOON;
  legend();
  document.querySelectorAll(".plot").forEach(figure);
}

document.getElementById("theme").addEventListener("click", () => {
  root.dataset.theme = isDark() ? "light" : "dark";
  draw();
});
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", draw);
build();
draw();
const plotEl = document.querySelector(".plot");
plotEl.addEventListener("pointerdown", e => { drag = [e.clientX, e.clientY]; }, true);
plotEl.addEventListener("dblclick", () => { Object.assign(VIEW, ISO); draw(); }, true);
addEventListener("pointermove", rotate);
addEventListener("pointerup", () => { drag = null; });
addEventListener("resize", draw);
</script>
