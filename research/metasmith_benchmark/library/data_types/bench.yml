types:
  # Types only the benchmark library has. Every property carries `bench`, so no standard transform binds to them.

  gtdb_genomes_image:
    properties:
      _: squashfs image of GTDB's skani genome trees, GCF/ and GCA/ at its root, bound over ref::gtdb's skani/database/GCF and GCA
      bench: gtdb_genomes_image
      ext: sqfs

  carveme_166.env:
    properties:
      bench: env
      provides: [carveme]

  checkm2_database:
    properties:
      _: CheckM2 DIAMOND database file (uniref100.KO.1.dmnd), the file E2's e2::checkm2_database cites
      bench: checkm2_database
      ext: dmnd
  checkm2_quality:
    properties:
      _: CheckM2 quality_report.tsv row for one bin, with its header
      bench: checkm2_quality
      ext: tsv
  checkm2.env:
    properties:
      bench: env
      provides: [checkm2]

  # Dereplication: every tool picks one non-redundant set from the three binners' bins. A per-sample
  # and a per-study type each, so both scopes can be targets in one plan.
  magscot_contig_to_bin:
    properties:
      _: MAGScoT's refined contig-to-bin table for one assembly, over MetaBAT2, SemiBin2 and COMEBin
      bench: magscot_contig_to_bin
      ext: tsv
  magscot_scores:
    properties:
      _: MAGScoT's per-bin completeness, contamination and score for the selected bins
      bench: magscot_scores
      ext: tsv
  drep_sample_winners:
    properties:
      _: dRep dereplicate over one assembly's bins, one row per input bin with its cluster and whether it won
      bench: drep_sample_winners
      ext: tsv
  drep_study_winners:
    properties:
      _: dRep dereplicate over every bin in a study, one row per input bin with its cluster and whether it won
      bench: drep_study_winners
      ext: tsv
  skani_sample_clusters:
    properties:
      _: skani ANI clusters at 95 and 99 over one assembly's bins, medoid marked per cluster
      bench: skani_sample_clusters
      ext: tsv
  skani_study_clusters:
    properties:
      _: skani ANI clusters at 95 and 99 over every bin in a study, medoid marked per cluster
      bench: skani_study_clusters
      ext: tsv
  viral_orfs:
    properties:
      _: prodigal-gv proteins for the frozen viral set
      bench: viral_orfs
      Format: FASTA
      Data: amino acid sequence
      ext: faa
  viral_gff:
    properties:
      _: prodigal-gv gene coordinates for the frozen viral set
      bench: viral_gff
      ext: gff
  drep.env:
    properties:
      bench: env
      provides: [drep]
  magscot.env:
    properties:
      bench: env
      provides: [magscot]
