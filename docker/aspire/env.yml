# The environment `resources/env/aspire.env` names: everything ASPIRE's vendored scripts
# import, in one env. Upstream spreads the same set over a dozen conda files, one per
# process, and they differ only in which subset of this they carry.
#
# R is 4.5 because SpiecEasi 1.1.1 is built for it only, on the `ursky` channel upstream's
# spieceasi env names. The python half covers the SINA log parser and trimmer, the table
# filter, the sankey (plotly 5, the last to export with kaleido 0.2.1, which bundles its
# own chromium for write_image), the ecology analyses and every seaborn plot. BLAST is the
# ASV-MAG linker's. SINA and vsearch stay in their own biocontainers.
name: aspire
channels:
  - conda-forge
  - bioconda
  - ursky
dependencies:
  - python=3.11
  - pandas=2.2.*
  - numpy
  - scipy
  - biopython
  - tqdm
  - matplotlib-base
  - seaborn
  - plotly=5.24.*
  - python-kaleido=0.2.1
  - scikit-learn
  - umap-learn
  - hdbscan
  - scikit-bio
  - statsmodels
  - statannotations
  - networkx
  - adjusttext
  - upsetplot
  - matplotlib-venn
  - fastcluster
  - blast
  - r-base=4.5
  - r-indicspecies
  - r-optparse
  - r-dplyr
  - r-purrr
  - r-readr
  - r-tibble
  - r-tidyr
  - r-permute
  - r-vegan
  - r-igraph
  - r-glmnet
  - r-huge
  - r-pulsar
  - r-rcpparmadillo
  - r-vgam
  - r-spieceasi=1.1.1
  - procps-ng
