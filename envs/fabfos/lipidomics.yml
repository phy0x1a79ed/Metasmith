name: lipidomics
channels:
  - bioconda
  - conda-forge
dependencies:
  - python=3.12
  - dotnet-runtime=8
  - pandas
  - numpy
  - scipy
  - statsmodels
  - scikit-learn
  - matplotlib
  - seaborn
  - jupyter
  - notebook
  - openpyxl
  - pyteomics
  - matchms
  - requests
# .d → mzML conversion is done by ProteoWizard msconvert running inside the
# chambm/pwiz-skyline-i-agree-to-the-vendor-licenses Docker image; pulled by
# lib/msdial/install.sh. No Python wrapper is needed.
