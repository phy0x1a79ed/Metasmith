target_types:
- amplicon::asv_table
- amplicon::asv_taxonomy
- aspire::counts_clean
- aspire::read_fate
- aspire::sankey_outputs
- aspire::analysis_metadata
- aspire::grouping_diagnostics_outputs
- aspire::power_analysis_outputs
- aspire::collectors_outputs
transform_libraries:
