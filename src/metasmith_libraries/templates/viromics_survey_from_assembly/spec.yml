name: viromics_survey_from_assembly
description: 'Call viral contigs from an assembly with VirSorter2 and geNomad, and
  quantify

  crAssphage coverage in the clean reads as a faecal-source marker. DRAM-v''s

  auxiliary metabolic genes need the vOTU stack; engcyc_metagenomics has them.'
transform_libraries:
- logistics
- metagenomics
- functionalAnnotation
resource_libraries:
- env
cases:
- name: case
  sample_type: sequences::assembly
  target_types:
  - annotation::virsorter2_viral_sequences
  - taxonomy::genomad_virus_summary
  - taxonomy::genomad_plasmid_summary
  - annotation::crassphage_coverage
  shared_input_paths: []
input_library:
  schema: v1
  manifest:
    /msm_deferred/bd283a9984b6436b86574c74949ec075:
      type: sequences::clean_short_reads
      parents:
        vLgTGx5gCxwQ@/msm_deferred/f9ca655a9f094e06b6cbaed0ca01b2c5: sequences::assembly
      instance_id: 1e209f818ffe0c1e8aefbb1dea413fcc55198668364fc662fa0d4c81d28a6fc1defe
      origin: leaf
    /msm_deferred/f9ca655a9f094e06b6cbaed0ca01b2c5:
      type: sequences::assembly
      instance_id: 1e2025464aae54f412cf7af5e186c89eed92804aa804150f0388b0bd4585ed153b2f
      origin: leaf
