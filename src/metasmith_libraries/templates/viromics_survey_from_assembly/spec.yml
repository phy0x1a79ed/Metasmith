name: viromics_survey_from_assembly
description: 'Call viral contigs from an assembly with VirSorter2 and geNomad, and
  quantify

  crAssphage coverage in the clean reads as a faecal-source marker. Cluster the

  viral contigs into vOTUs and annotate each with DRAM-v, which reports its

  auxiliary metabolic genes.'
transform_libraries:
- logistics
- metagenomics
- functionalAnnotation
- viromics
resource_libraries:
- env
- lib
- ref
cases:
- name: case
  sample_type: null
  target_types:
  - annotation::virsorter2_viral_sequences
  - taxonomy::genomad_virus_summary
  - taxonomy::genomad_plasmid_summary
  - annotation::crassphage_coverage
  - annotation::dramv_amg_summary
  shared_input_paths:
  - contig_study.json
  - eggnog_source.json
input_library:
  schema: v1
  manifest:
    /msm_deferred/71dd291a44d54bb199af6dd69b749737:
      type: sequences::clean_short_reads
      parents:
        DxhW47sTETTx@/msm_deferred/9c0380d8826441fab875ac2169122d1a: sequences::assembly
      instance_id: 1e20b4a4a4f0219b093c982cc2df1f7c6209cc3f05f6046ab84aee9c21285169924a
      origin: leaf
    /msm_deferred/9c0380d8826441fab875ac2169122d1a:
