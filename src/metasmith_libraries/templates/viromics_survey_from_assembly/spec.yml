      parents:
        DxhW47sTETTx@sample_reads_metadata.json: sequences::read_metadata
      instance_id: 1e20e63e2efc6cee067260a31ba8329a5c122278aec066db772caca22f8de7fe134f
      origin: leaf
    contig_study.json:
