name: annotation_table_from_assembly
description: 'Run every annotation lane against an existing assembly and collect their
  calls into one

  long annotation::annotation_table, one row per lane, ORF or contig feature, and
  term. Also

  cuts the GPR evidence table over every reaction-mapping lane from it

  (annotation::gpr_table_all). The PSORTm lane''s contig taxonomy is LCA* from the
  UniRef50

  ORF LCAs and the rRNA calls, without Metabuli.


  Every lane includes MetaCyc, which is licensed: give the Pathway Tools installer

  (licensed::pathway_tools_package), from which the MetaCyc 27.0 references are built.'
transform_libraries:
- metagenomics
- logistics
- functionalAnnotation
- fabfos
resource_libraries:
- env
- lib
cases:
- name: case
  sample_type: null
  target_types:
  - taxonomy::contig_lcastar_no_metabuli
  - type: annotation::annotation_table
    parents:
    - 0
  - annotation::gpr_table_all
  shared_input_paths: []
